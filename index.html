<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instruction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            height: 100vh;
            position: relative;
            background: linear-gradient(135deg, #4B0082, #0000FF);
            display: none; /* Прячем контент до проверки JS */
        }
        .arrow {
            line-height: 0.7;
            color: white;
            position: fixed;
            font-size: 120px;
            animation: pulse 1.5s infinite;
            text-shadow: 2px 2px 4px black;
        }
        .arrow-up {
            top: 1px;
            right: 10px;
        }
        .arrow-down {
            bottom: 35%;
            left: 10px;
        }
        .instruction {
            font-size: 30px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px black;
            position: absolute;
        }
        .instruction-up {
            top: 15%;
            right: 10px;
            text-align: right;
        }
        .instruction-down {
            bottom: 47%;
            left: 10px;
            text-align: left;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="arrow arrow-up">↑</div>
    <div id="text-open-menu" class="instruction instruction-up"></div>

    <div class="arrow arrow-down">↓</div>
    <div id="text-open-browser" class="instruction instruction-down"></div>

    <script>
        // Твоя ссылка для редиректа
        const redirectUrl = "https://tone.affomelody.com/ggy9gB";

        const translations = {
            'en': { title: 'Instruction', open_menu: 'Tap on the three dots', open_browser: 'Tap "Open in browser"' },
            'es': { title: 'Instrucción', open_menu: 'Toca los tres puntos', open_browser: 'Toca "Abrir en el navegador"' },
            'zh': { title: '说明', open_menu: '点击三个点', open_browser: '点击 "在浏览器中打开"' },
            'hi': { title: 'निर्देश', open_menu: 'तीन डॉट्स पर टैп करें', open_browser: '"ब्राउज़र में खोलें" पर टैप करें' },
            'ar': { title: 'تعليمات', open_menu: 'اضغط على النقاط الثلاث', open_browser: 'اضغط на "فتح في المتصفح"' },
            'pt': { title: 'Instrução', open_menu: 'Toque nos três pontos', open_browser: 'Toque em "Abrir no navegador"' },
            'ru': { title: 'Инструкция', open_menu: 'Нажмите на 3 точки', open_browser: 'Нажмите "Открыть в браузере"' },
            'ja': { title: '説明', open_menu: '3つの点をタップ', open_browser: '"ブラウザで開く"をタップ' },
            'de': { title: 'Anleitung', open_menu: 'Tippen Sie auf die drei Punkte', open_browser: 'Tippen Sie auf "Im Browser öffnen"' },
            'fr': { title: 'Instruction', open_menu: 'Appuyez sur les trois points', open_browser: 'Appuyez sur "Ouvrir dans le navigateur"' }
        };

        // Определяем язык
        const userLang = (navigator.language || navigator.userLanguage).substring(0, 2);
        const text = translations[userLang] || translations['en'];

        // Проверка User-Agent на наличие Bytedance (TikTok и т.д.)
        const ua = navigator.userAgent;
        const isBytedance = ua.includes("BytedanceWebview");

        if (!isBytedance) {
            // Если зашли через обычный браузер (Chrome, Safari) — сразу редирект
            window.location.replace(redirectUrl);
        } else {
            // Если внутри WebView — показываем инструкцию, как выйти в браузер
            document.title = text.title;
            document.getElementById('text-open-menu').innerText = text.open_menu;
            document.getElementById('text-open-browser').innerText = text.open_browser;
            document.body.style.display = 'block';
        }
    </script>
</body>
</html>
